name: Morning Pipeline for Playwright tests
on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: 
    - 'main'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test-to-run:
        description: "Add you npx code here"
        required: false
        default: 'npm run script:to:run'
        type: string
      workers:
        description: "Number of workers to use"
        required: false
        default: '1'
        type: choice
        option:
          - '1'
          - '2'
          - '3'
          - '4'
      browsers:
        description: "Browsers to run tests on"
        required: false
        default: 'chromium'
        type: choice
        option:
          - 'chromium'
          - 'firefox'
          - 'webkit'
          - 'all'
        
jobs:
  Playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      env:
        test-to-run: ${{github.event.inputs.test-to-run || 'npm run script:to:run'}}
        workers: ${{github.event.inputs.workers || '1'}}
        browsers: ${{github.event.inputs.browsers || 'chromium'}}
      
      run: |
        ${{env.test-to-run}} -- --workers=${{env.workers}} -- project=${{env.browsers}} || npm run posttest

    - name: Upload Allure Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        path: allure-report/
        retention-days: 30

  run-snyk-scan:
    name: Run Snyk to check for vulnerabilities
    needs: Playwright-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
  run-zap-scan:
      name: ZAP Scan
      needs: Playwright-tests
      uses: zaproxy/action-full-scan@v0.13.0
      with:
        target: 'https://the-internet.herokuapp.com/'
        
